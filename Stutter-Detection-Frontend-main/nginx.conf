user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100M;

    sendfile on;
    keepalive_timeout 65;

    # THE SECRET SAUCE: Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # =========================================================================
    # LOCAL localhost CONFIGURATION (ACTIVE BY DEFAULT FOR TESTING)
    # =========================================================================
    server {
        listen 80;
        server_name localhost _;

        root /usr/share/nginx/html;
        index index.html;

        location /api {
            # Use a variable to force lazy-loading (prevents startup crash)
            set $target http://backend:10000;
            proxy_pass $target;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ✅ FIX: Explicit timeouts — default was 60s which caused silent drops
            client_max_body_size 200M;
            proxy_read_timeout    300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
        }

        location /uploads/ {
            proxy_pass http://backend:10000/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 200M;
        }

        location /analysis_results/ {
            proxy_pass http://backend:10000/analysis_results/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # =========================================================================
    # PRODUCTION SSL CONFIGURATION (COMMENTED OUT BY DEFAULT FOR LOCAL DEV)
    # =========================================================================
