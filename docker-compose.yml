services:
  backend:
    build:
      context: ./Stutter-detection-backend-main
      dockerfile: Dockerfile
    container_name: R-B1
    ports:
      - "10000:10000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - PYTHONUNBUFFERED=1
      - FLASK_APP=app:app
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./Stutter-detection-backend-main/uploads:/app/uploads
      - ./Stutter-detection-backend-main/analysis_results:/app/analysis_results
      - hf-model-cache:/root/.cache/huggingface
    networks:
      - stutter-network
    restart: unless-stopped
    expose:
      - "10000"

  frontend:
    build:
      context: ./Stutter-Detection-Frontend-main
      dockerfile: Dockerfile
    container_name: R-F1
    restart: unless-stopped
    expose:
      - "80"

    ports:
      - "80:80"

    volumes:
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./Stutter-Detection-Frontend-main/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - stutter-network

networks:
  stutter-network:
    driver: bridge

volumes:
  hf-model-cache:
